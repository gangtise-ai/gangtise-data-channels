[project]
name = "gangtise-cli"
version = "0.1.0"
description = "Unified Gangtise CLI. Runtime is cli/src/_generated only."
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Gangtise" }]
dependencies = [
    "requests>=2.32.5",
    "pandas>=2.2.3",
    "pyyaml>=6.0",
]

[project.scripts]
gangtise = "gangtise_cli.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gangtise_cli"]

[tool.hatch.build.targets.wheel.force-include]
"src/_generated" = "_generated"
"src/_use_generated.py" = "_use_generated.py"
