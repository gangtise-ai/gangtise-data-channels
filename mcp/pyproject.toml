[project]
name = "gangtise-mcp"
version = "0.1.0"
description = "Unified Gangtise MCP (stdio + HTTP/SSE). Runtime is mcp/src/_generated only."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Gangtise" }]
dependencies = [
    "mcp>=1.0.0,<2",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "requests>=2.32.5",
    "pandas>=2.2.3",
    "pyyaml>=6.0",
    "starlette>=0.37.0",
    "PyJWT>=2.8.0",
    "cryptography>=42.0.0",
]

[project.scripts]
gangtise-mcp = "stdio_server:main"
gangtise-mcp-api = "http_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.hatch.build.targets.wheel.force-include]
"src/oauth_consent.html" = "oauth_consent.html"
