# `mode` ties an endpoint to the handler's `mode` argument (multi-mode tools).
vault.stock-pool.list:
  method: POST
  path: /stock-pool/getPoolList
  tool: stockpool
  mode: search
vault.stock-pool.stocks:
  method: POST
  path: /stock-pool/getStockList
  tool: stockpool
  mode: get
vault.stock-pool.create:
  method: POST
  path: /stock-pool/createPool
  retry: no-replay
  tool: stockpool
  mode: create
vault.stock-pool.rename:
  method: POST
  path: /stock-pool/updatePool
  tool: stockpool
  mode: rename
vault.stock-pool.add:
  method: POST
  path: /stock-pool/addStock
  item_failures: true
  tool: stockpool
  mode: add_stock
vault.stock-pool.remove:
  method: POST
  path: /stock-pool/deleteStock
  item_failures: true
  tool: stockpool
  mode: delete_stock
vault.stock-pool.delete:
  method: POST
  path: /stock-pool/deletePool
  retry: no-replay
  item_failures: true
  tool: stockpool
  mode: delete
  destructive:
    warning: 删除股票池会同时移除池内全部证券的关注关系，且不可恢复（投资笔记不受影响）；先用 stockpool search 核对 ID 对应的池名，经用户确认后加 --yes 重试。
vault.stock-pool.notes:
  method: POST
  path: /stock-pool/getNoteList
  tool: stockpool
  mode: search_note
vault.stock-pool.add-note:
  method: POST
  path: /stock-pool/addNote
  retry: no-replay
  tool: stockpool
  mode: add_note
vault.stock-pool.update-note:
  method: POST
  path: /stock-pool/updateNote
  tool: stockpool
  mode: update_note
vault.stock-pool.delete-note:
  method: POST
  path: /stock-pool/deleteNote
  retry: no-replay
  item_failures: true
  tool: stockpool
  mode: delete_note
  destructive:
    warning: 删除个股笔记不可恢复；先用 search_note 核对 stockNoteId 对应内容，经用户确认后加 --yes（MCP 传 confirm=true）重试。
vault.conference.download:
  method: GET
  path: /my-conference/download/file
  kind: download
  retry: no-replay
  tool: private_meeting
vault.record.download:
  method: GET
  path: /record/download/file
  kind: download
  retry: no-replay
  tool: private_record
vault.wechatgroupmsg.download:
  method: GET
  path: /wechatgroupmsg/download/file
  kind: download
  retry: no-replay
  tool: wechat_message
  mode: download
vault.drive.list:
  method: POST
  path: /drive/getList
  timeout_s: 300
  tool: private_cloud
  mode: search
vault.drive.download:
  method: GET
  path: /drive/download/file
  kind: download
  retry: no-replay
  tool: private_cloud
  mode: get
vault.drive.folder-list:
  method: POST
  path: /drive/getFolderList
  tool: private_cloud
  mode: folder_list
vault.drive.upload:
  method: POST
  path: /drive/uploadFile
  retry: no-replay
  timeout_s: 600
  tool: private_cloud
  mode: upload
vault.drive.create-folder:
  method: POST
  path: /drive/createFolder
  retry: no-replay
  tool: private_cloud
  mode: create_folder
vault.drive.rename:
  method: POST
  path: /drive/rename
  tool: private_cloud
  mode: rename
vault.drive.move-file:
  method: POST
  path: /drive/moveFile
  item_failures: true
  tool: private_cloud
  mode: move_file
vault.drive.move-folder:
  method: POST
  path: /drive/moveFolder
  tool: private_cloud
  mode: move_folder
vault.drive.copy:
  method: POST
  path: /drive/copy
  retry: no-replay
  item_failures: true
  tool: private_cloud
  mode: copy
vault.drive.delete-file:
  method: POST
  path: /drive/deleteFile
  retry: no-replay
  item_failures: true
  tool: private_cloud
  mode: delete_file
  destructive:
    warning: 删除的云盘文件无法恢复；先用 private_cloud search 核对文件 ID 对应的文件名，经用户确认后加 --yes 重试。
vault.drive.delete-folder:
  method: POST
  path: /drive/deleteFolder
  retry: no-replay
  tool: private_cloud
  mode: delete_folder
  destructive:
    warning: 删除文件夹会连同其中全部子文件夹与文件一起删除，且无法恢复；先用 private_cloud folder_list 看清里面有什么，经用户确认后加 --yes 重试。
