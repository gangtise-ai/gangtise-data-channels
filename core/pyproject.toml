[project]
name = "gangtise-core"
version = "0.1.0"
description = "Shared Gangtise runtime: envelope, auth, Result, transport."
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Gangtise" }]
dependencies = [
    "requests>=2.32.5",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gangtise_core"]

[tool.hatch.build.targets.wheel.force-include]
"src/gangtise_core/data" = "gangtise_core/data"
