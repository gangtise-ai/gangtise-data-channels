name: indicator
title: Indicator
description: |
  检索或拉取基金相关公司指标（EDE）。只接受基金，场外基金请直接传 .OF。keyword 检索指标；indicator_codes 与 securities 一起传入则取数。日频行情不含当天实时。
parameters:
  keyword:
    type: string
    description: 检索关键词，如「复权单位净值」「收盘价」
  indicator_codes:
    type: string
    description: 指标编码或名称，逗号分隔；提供后与 securities 一并取数
  securities:
    type: array
    description: 基金代码/简称/拼音，逗号分隔；亦可传 .csv 路径。场外基金用 .OF
    items:
      type: string
  start_date:
    type: string
    description: 开始日期 yyyy-MM-dd。日频默认近一年
  end_date:
    type: string
    description: 结束日期 yyyy-MM-dd。日频不含当天实时
  params:
    type: object
    description: "JSON 参数。根级为全局参数，嵌套指标编码可单独覆盖"
