name: financial
title: Financial
description: 拉取发债公司财务报表（利润表/资产负债表/现金流量表）。只接受债券，代码走 A 股 financial-report，返回发行人三表。支持报告期 Q1–Q4/Q0；利润表和现金流量表可选累计或单季度，资产负债表仅累计值。
parameters:
  securities:
    type: array
    description: 债券代码/简称/拼音，逗号分隔；亦可传 .csv 路径
    items:
      type: string
    required: true
  start_date:
    type: string
    description: 开始日期 yyyy-MM-dd。与 end_date 同时有值时覆盖 fiscal_year 的筛选
  end_date:
    type: string
    description: 结束日期 yyyy-MM-dd
  fiscal_year:
    type: array
    description: 财报年度，逗号分隔，如 2024,2025
    items:
      type: string
  period:
    type: array
    description: 报告期 Q1 / Q2 / Q3 / Q4 / Q0，逗号分隔；默认 Q0（最新一期）
    items:
      type: string
  report_type:
    type: array
    description: consolidated / consolidatedRestated / standalone / standaloneRestated，默认 consolidated
    items:
      type: string
  field_list:
    type: array
    description: 科目英文名，逗号分隔；不传返回全部科目
    items:
      type: string
  table_type:
    type: string
    description: income/利润表、balance/资产负债表、cashflow/现金流量表。默认 income
  granularity:
    type: string
    description: accumulated（累计值，默认）/ quarterly（单季度）。仅利润表和现金流量表支持 quarterly
