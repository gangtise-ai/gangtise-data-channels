name: cash_flow
title: CashFlow
description: "债券付息兑付明细：历次及未来付息/兑付日期、每百元付息额与本金兑付额。不传日期返回全部兑付计划。"
parameters:
  securities:
    type: array
    description: "债券代码/简称/拼音，逗号分隔；亦可传 .csv 路径（含 security_code / 债券代码 等列）"
    items:
      type: string
    required: true
  start_date:
    type: string
    description: "兑付日期起始 yyyy-MM-dd；不传返回全部兑付计划"
  end_date:
    type: string
    description: "兑付日期截止 yyyy-MM-dd；不传返回全部兑付计划"
  field_list:
    type: array
    description: "字段英文名或中文名，逗号分隔；不传返回全部 10 个字段"
    items:
      type: string
