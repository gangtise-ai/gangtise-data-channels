name: investment_calendar
title: Investment Calendar
description: 检索投资日历：路演、调研、线下策略会、论坛、财报日历；财报日历区分已发布（可下载原文件）与尚未发布（日程预告）。
parameters:
  kind:
    type: string
    description: 投资日历活动类型
    required: true
  keyword:
    type: string
    description: 搜索关键词
  start_date:
    type: string
    description: 举办起始日期，格式 yyyy-MM-dd。路演/调研/线下策略会/论坛转为 startTime；财报日历为发布日期 startDate
  end_date:
    type: string
    description: 举办结束日期，格式 yyyy-MM-dd。路演等结束日含全天，转为 endTime；财报日历为 endDate
  publish_start_date:
    type: string
    description: 收录起始时间，yyyy-MM-dd 或 yyyy-MM-dd HH:mm:ss。仅路演/调研/线下策略会/论坛，转为 publishStartTime。按日程信息首次被收录的时间过滤，与 start_date/end_date（举办时间）为与关系。不传则不按收录时间过滤
  publish_end_date:
    type: string
    description: 收录结束时间，格式同 publish_start_date；只传日期时含当天全天，转为 publishEndTime。仅路演/调研/线下策略会/论坛
  limit:
    type: integer
    description: 返回条数上限
  securities:
    type: array
    description: 证券名称或代码列表
    items:
      type: string
  institutions:
    type: array
    description: 牵头机构名称（roadshow/site_visit/strategy_meeting）
    items:
      type: string
  research_areas:
    type: array
    description: 研究方向或行业（roadshow/site_visit/forum）：宏观/策略/固收/金工/海外，或行业名称/ID（见 get_industries）
    items:
      type: string
  category_list:
    type: array
    description: 分类/类型列表；帕米尔专家纪要可选 companyAnalysis/industryAnalysis（或中文：公司分析/行业分析）
    items:
      type: string
  market_list:
    type: array
    description: 市场类别列表；可选 aShares/hkStocks/usChinaConcept/usStocks（或中文：A股/港股/美股中概/美股）
    items:
      type: string
  participant_role_list:
    type: array
    description: 仅 roadshow：参会人标识 management/expert（或中文：高管/专家）
    items:
      type: string
  broker_type_list:
    type: array
    description: 仅 roadshow：卖方类型 cnBroker/otherBroker
    items:
      type: string
  permission_list:
    type: array
    description: roadshow/site_visit：权限 1 公开、2 私密
    items:
      type: string
  object_list:
    type: array
    description: 仅 site_visit：调研对象 company/industry
    items:
      type: string
  download:
    type: boolean
    description: 是否下载文件全文
  confirm:
    type: boolean
    description: 预计积分消耗较大时（脚本会拒绝并提示）必填 true；路演/调研/策略会/论坛未传 limit 时默认 50 条。须先向用户说明并取得同意
