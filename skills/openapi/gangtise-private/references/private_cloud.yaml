name: private_cloud
title: Private Cloud
description: |
  AI 云盘：检索/下载文件、浏览文件夹，以及上传、新建文件夹、重命名、移动、复制、删除，通过 mode 区分。search 列表不含对话、AI 速记、AI 翻译文件夹。
  upload/create_folder/rename/move_file/move_folder/copy/delete_file/delete_folder 会修改用户云盘，调用前须与用户确认；delete_folder 会级联删除且不可恢复。
parameters:
  mode:
    type: string
    description: "search 检索文件（默认，提供 file_ids 时自动下载）；get 下载；folder_list 浏览文件夹；upload 上传本地文件；create_folder 新建文件夹；rename 重命名文件或文件夹；move_file 批量移动文件；move_folder 移动文件夹；copy 跨空间复制（我的云盘与租户云盘之间）；delete_file 批量删除文件；delete_folder 删除文件夹"
    enum:
      - search
      - get
      - folder_list
      - upload
      - create_folder
      - rename
      - move_file
      - move_folder
      - copy
      - delete_file
      - delete_folder
    default: search
  keyword:
    type: string
    description: 文件标题关键词（search）
  file_ids:
    type: string
    description: 文件 ID 或标题，逗号分隔；纯字母数字视为 ID，否则按标题唯一完全匹配解析（get/rename/move_file/copy/delete_file）
  start_time:
    type: string
    description: "起始时间，格式 yyyy-MM-dd 或 yyyy-MM-dd HH:mm:ss（search）"
  end_time:
    type: string
    description: "结束时间，格式 yyyy-MM-dd 或 yyyy-MM-dd HH:mm:ss（search）"
  file_type_list:
    type: array
    description: document image media article other，或中文（文档、图片、音视频等）（search）
    items:
      type: string
  space_type_list:
    type: array
    description: 1 我的云盘、2 租户云盘（可传中文）（search）
    items:
      type: string
  limit:
    type: integer
    description: search 列表条数上限（默认 100）
  page_from:
    type: integer
    description: 分页起始（从 0 开始）
  page_size:
    type: integer
    description: 每页条数，最大 50
  space_type:
    type: string
    description: 单个所属区域 1 我的云盘 / 2 租户云盘，可传中文；folder_list/upload/create_folder 使用，默认 1
  parent_id:
    type: string
    description: 父文件夹 ID，root 或不传为根目录（folder_list/create_folder）
  folder_id:
    type: string
    description: 文件夹 ID；upload 时为目标文件夹，rename/move_folder/copy/delete_folder 时为源文件夹
  target_folder_id:
    type: string
    description: 目标（父）文件夹 ID，root 为根目录（move_file/move_folder/copy；copy 须位于源所在空间的另一空间）
  target_type:
    type: string
    description: rename/copy 的对象类型；不传时按是否提供 file_ids / folder_id 自动判断
    enum:
      - file
      - folder
  name:
    type: string
    description: create_folder 的文件夹名；rename 的新名称；upload 单文件时的文件名（不超过 200 字符）
  file_paths:
    type: array
    description: 本地文件路径，单个不超过 100MB（upload）
    items:
      type: string
  confirm:
    type: boolean
    description: delete_file/delete_folder 必填 true：删除不可恢复。须先向用户列出将被删除的对象并取得明确同意后才能传 true；被拒后不要自行补 true 重试
