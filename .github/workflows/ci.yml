name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install pytest pandas pyyaml requests
      - name: Generate check
        run: python3 scripts/generate.py --check
      - name: Unit tests
        env:
          PYTHONPATH: core/src:cli/src:mcp/src
        run: pytest -q
